[package]
name = "fod-direct-escrow"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
risc0-groth16 = { version = "3.0.5", default-features = false }
risc0-zkp = { version = "3.0.5", default-features = false }
sha2 = { version = "0.10", default-features = false }

[dev-dependencies]
hex-literal = "0.4"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
