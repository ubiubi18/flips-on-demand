[package]
name = "fod-bonded-market-v9"
version = "0.9.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["fast-candidate"]
fast-candidate = []

[dependencies]
sha2 = { version = "0.10", default-features = false }
risc0-groth16 = { version = "3.0.5", default-features = false }
risc0-zkp = { version = "3.0.5", default-features = false }
fod-fast-content-core = { path = "../../proofs/fast-content-core" }
fod-fast-session-core = { path = "../../proofs/fast-session-core" }
fod-delivery-core = { path = "../../proofs/delivery/core" }

[dev-dependencies]
serde_json = "1.0"
hex-literal = "0.4"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
