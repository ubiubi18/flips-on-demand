[package]
name = "fod-r0-receipt-verify"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
risc0-groth16 = { version = "3.0.5", default-features = false }
risc0-zkp = { version = "3.0.5", default-features = false }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
