<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Flips on Demand</title>
    <style>
      :root {
  --ink: #14161a;
  --muted: #5b6472;
  --line: #dfe3e8;
  --surface: #ffffff;
  --surface-alt: #f6f7f9;
  --accent: #0f766e;
  --accent-weak: #e6f2f1;
  --danger: #b42318;
  --warning: #b54708;
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  font-size: 15px;
  color: var(--ink);
  background: var(--surface);
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: var(--surface);
}

.masthead {
  border-bottom: 1px solid var(--line);
  padding: 16px 24px 0;
  background: var(--surface);
}

.masthead-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  flex-wrap: wrap;
}

h1 {
  font-size: 19px;
  font-weight: 600;
  margin: 0;
  letter-spacing: 0;
}

h2 {
  font-size: 17px;
  font-weight: 600;
  margin: 0 0 12px;
}

h3 {
  font-size: 14px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  color: var(--muted);
  margin: 24px 0 8px;
}

.import input {
  position: absolute;
  width: 1px;
  height: 1px;
  opacity: 0;
}

.import span {
  display: inline-block;
  border: 1px solid var(--line);
  border-radius: 6px;
  padding: 7px 12px;
  font-size: 14px;
  cursor: pointer;
  background: var(--surface);
}

.import span:hover {
  border-color: var(--accent);
  color: var(--accent);
}

.import input:focus-visible + span {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}

.tabs {
  display: flex;
  gap: 4px;
  margin-top: 14px;
}

.tabs a {
  padding: 8px 12px;
  font-size: 14px;
  color: var(--muted);
  text-decoration: none;
  border-bottom: 2px solid transparent;
}

.tabs a[aria-current="page"] {
  color: var(--ink);
  border-bottom-color: var(--accent);
  font-weight: 600;
}

.provenance {
  display: flex;
  flex-wrap: wrap;
  gap: 4px;
  align-items: center;
  padding: 8px 0 10px;
  font-size: 12.5px;
  color: var(--muted);
}

.provenance > span:not(:first-child)::before {
  content: "\00b7";
  margin: 0 6px 0 2px;
}

.provenance .warning {
  color: var(--warning);
}

main {
  padding: 20px 24px 48px;
  max-width: 1080px;
}

.muted {
  color: var(--muted);
}

/* The two sequences a participant chooses between: four pictures each. */
.flip-variants {
  display: flex;
  gap: 16px;
}

.flip-variant {
  margin: 0;
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.flip-sequence {
  display: grid;
  grid-template-columns: repeat(2, 56px);
  gap: 2px;
}

.flip-sequence img {
  width: 56px;
  height: 42px;
  object-fit: cover;
  border: 1px solid var(--line);
  border-radius: 4px;
  background: var(--surface-alt);
}

.notice {
  border: 1px solid var(--accent);
  border-radius: 8px;
  background: var(--accent-weak);
  color: var(--ink);
  margin: 12px 0 0;
  padding: 10px 12px;
  max-width: 68ch;
}

.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  font-size: 13px;
  overflow-wrap: anywhere;
}

.toolbar {
  display: flex;
  align-items: center;
  gap: 12px;
  flex-wrap: wrap;
  margin-bottom: 12px;
}

.toolbar input[type="search"] {
  flex: 1 1 220px;
  min-width: 180px;
  padding: 7px 10px;
  border: 1px solid var(--line);
  border-radius: 6px;
  font-size: 14px;
}

.segmented {
  display: inline-flex;
  border: 1px solid var(--line);
  border-radius: 6px;
  overflow: hidden;
}

.segmented button {
  border: 0;
  padding: 7px 14px;
  background: var(--surface);
  font-size: 14px;
  cursor: pointer;
  color: var(--muted);
}

.segmented button[aria-pressed="true"] {
  background: var(--accent-weak);
  color: var(--accent);
  font-weight: 600;
}

.table-wrap {
  overflow-x: auto;
  border: 1px solid var(--line);
  border-radius: 8px;
}

.pool-more {
  border: 0;
  background: none;
  color: var(--accent);
  font: inherit;
  text-decoration: underline;
  cursor: pointer;
}

.pool-nav {
  display: flex;
  gap: 18px;
  margin: 16px 0;
}

.pool-lookup {
  display: flex;
  align-items: center;
  gap: 12px;
  flex-wrap: wrap;
  margin-top: 24px;
}

.pool-lookup input {
  flex: 1 1 220px;
  max-width: 360px;
  min-width: 0;
  padding: 7px 10px;
  border: 1px solid var(--line);
  border-radius: 6px;
  font: inherit;
}

.pool-id {
  border: 0;
  padding: 0;
}

.pool-id code,
.pool-cids code {
  display: block;
  font-size: 12px;
  overflow-wrap: anywhere;
  user-select: all;
}

.pool-cids {
  padding-left: 20px;
}

.pool-cids li + li {
  margin-top: 8px;
}

.pool-preview {
  margin-top: 6px;
}

.pool-preview p {
  margin: 6px 0;
}

.pool-preview-images {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}

.pool-preview-images img {
  width: 120px;
  height: 90px;
  object-fit: contain;
  border: 1px solid var(--line);
  border-radius: 4px;
}

.pool-curve {
  margin: 0 0 20px;
}

.pool-curve h3 {
  margin-top: 0;
}

.pool-curve p {
  margin: 0 0 8px;
}

.pool-curve-chart {
  display: block;
  width: min(100%, 360px);
  height: auto;
  color: var(--accent);
}

.pool-curve-values {
  display: flex;
  flex-wrap: wrap;
  gap: 8px 20px;
  margin: 8px 0 0;
}

.pool-curve-values div {
  min-width: 110px;
}

.pool-curve-values dt {
  font-size: 12px;
  color: var(--muted);
}

.pool-curve-values dd {
  margin: 2px 0 0;
  font-variant-numeric: tabular-nums;
  overflow-wrap: anywhere;
}

.pool-orders table {
  min-width: 800px;
}

table {
  width: 100%;
  border-collapse: collapse;
  font-size: 14px;
  min-width: 620px;
}

th,
td {
  text-align: left;
  padding: 9px 12px;
  border-bottom: 1px solid var(--line);
}

th {
  white-space: nowrap;
}

td {
  vertical-align: top;
  white-space: normal;
  overflow-wrap: anywhere;
}

tbody tr:last-child td {
  border-bottom: 0;
}

th {
  font-size: 12.5px;
  font-weight: 600;
  color: var(--muted);
  background: var(--surface-alt);
}

.numeric {
  text-align: right;
  font-variant-numeric: tabular-nums;
}

/* Labels for the phone's stacked rows; the desktop table has its header row. */
.field-label {
  display: none;
}

.chip {
  display: inline-block;
  padding: 2px 8px;
  border-radius: 999px;
  font-size: 12px;
  border: 1px solid var(--line);
  color: var(--muted);
  background: var(--surface-alt);
}

.chip-open,
.chip-sold {
  color: var(--accent);
  border-color: var(--accent);
  background: var(--accent-weak);
}

.chip-funded {
  color: var(--warning);
  border-color: var(--warning);
  background: #fdf3e7;
}

.chip-refunded,
.chip-cancelled {
  color: var(--muted);
}

.linklike {
  background: none;
  border: 0;
  padding: 0;
  font: inherit;
  color: var(--accent);
  cursor: pointer;
  text-decoration: underline;
}

/* Rows can carry more than one action; without a gap the underlined labels run
   together ("ConfirmReceive"). */
td .linklike + .linklike {
  margin-left: 12px;
}

.facts {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap: 12px 24px;
  margin: 0 0 20px;
}

.facts dt {
  font-size: 12.5px;
  color: var(--muted);
  margin-bottom: 2px;
}

.facts dd {
  margin: 0;
}

.section-head {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 12px;
}

.section-head h2 {
  margin: 0;
}

.actions {
  display: flex;
  align-items: center;
  gap: 12px;
  margin: 4px 0 20px;
}

button.primary {
  border: 1px solid var(--accent);
  background: var(--accent);
  color: #fff;
  border-radius: 6px;
  padding: 8px 18px;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
}

button.primary:disabled {
  background: var(--surface-alt);
  border-color: var(--line);
  color: var(--muted);
  cursor: not-allowed;
}

.market button.primary {
  white-space: nowrap;
}

details {
  border-top: 1px solid var(--line);
  padding: 10px 0;
}

details summary {
  cursor: pointer;
  font-size: 14px;
  font-weight: 500;
}

details[open] summary {
  margin-bottom: 10px;
}

section.empty,
.banner {
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 16px 18px;
  background: var(--surface-alt);
}

.banner {
  border-color: var(--danger);
  color: var(--danger);
  margin: 0 0 16px;
}

.faq details p {
  margin: 0 0 8px;
  max-width: 68ch;
  line-height: 1.5;
}

@media (max-width: 560px) {
  .masthead,
  main {
    padding-left: 16px;
    padding-right: 16px;
  }

  .table-wrap th,
  .table-wrap td {
    padding-left: 8px;
    padding-right: 8px;
  }

  /* The desktop floor keeps the wide tables readable; a phone fits what it
     shows, and anything wider still scrolls inside the wrap. */
  .table-wrap table {
    min-width: 0;
  }

  /* On a phone a table row becomes a short card: each value keeps its label, and
     every action sits inside the screen instead of past its edge. */
  .stack thead {
    display: none;
  }

  .stack,
  .stack tbody,
  .stack tr,
  .stack td {
    display: block;
    width: auto;
  }

  .stack tr {
    padding: 10px 4px;
    border-bottom: 1px solid var(--line);
  }

  .stack tr:last-child {
    border-bottom: 0;
  }

  .stack td {
    border-bottom: 0;
    padding: 4px 8px;
    white-space: normal;
    overflow-wrap: anywhere;
  }

  /* Stacked, each value reads as a line under its label, so the numeric
     alignment of a table column no longer applies. */
  .stack td.numeric {
    text-align: left;
  }

  /* A phone gets a full-width tap target instead of a link-sized button. */
  .stack td button.primary {
    width: 100%;
    padding: 10px 18px;
  }

  .field-label {
    display: block;
    font-size: 12.5px;
    color: var(--muted);
    margin-bottom: 4px;
  }
}

/* The pool is a browsing surface. Keep chain controls and risk detail outside
   the visual path from the next bundle to its original public flips. */
main:has(.pool-market) {
  max-width: 1280px;
}

.pool-market {
  --pool-ink: #183133;
  --pool-deep: #10292b;
  --pool-teal: #126f68;
  --pool-tint: #eef5ed;
  --pool-sand: #f7f5ec;
  --pool-stroke: #dce6df;
  color: var(--pool-ink);
}

.pool-hero {
  position: relative;
  display: grid;
  grid-template-columns: minmax(0, 1.45fr) minmax(250px, 0.75fr);
  align-items: end;
  gap: 28px;
  overflow: hidden;
  padding: 38px 42px;
  border-radius: 24px;
  color: #f7faf4;
  background: radial-gradient(circle at 86% 20%, #2a6662 0, transparent 30%), linear-gradient(130deg, #10292b 0%, #1d4546 100%);
}

.pool-hero::after {
  content: "";
  position: absolute;
  width: 440px;
  height: 440px;
  right: -165px;
  top: -235px;
  border: 1px solid rgb(255 255 255 / 17%);
  border-radius: 50%;
  box-shadow: 0 0 0 64px rgb(255 255 255 / 3%), 0 0 0 128px rgb(255 255 255 / 3%);
  pointer-events: none;
}

.pool-hero > * {
  position: relative;
  z-index: 1;
}

.pool-eyebrow {
  margin: 0 0 10px;
  font-size: 11px;
  font-weight: 760;
  letter-spacing: 0.16em;
}

.pool-hero .pool-eyebrow {
  color: #a7ded3;
}

.pool-eyebrow span {
  padding: 0 7px;
  opacity: 0.6;
}

.pool-hero h2 {
  max-width: 13ch;
  margin: 0;
  font-size: clamp(34px, 4vw, 57px);
  line-height: 1.04;
  font-weight: 700;
  letter-spacing: -0.055em;
}

.pool-hero-description {
  max-width: 50ch;
  margin: 16px 0 0;
  color: #d6e8e2;
  font-size: 15px;
  line-height: 1.55;
}

.pool-hero-quote {
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: 9px;
  padding: 20px 22px;
  border: 1px solid rgb(255 255 255 / 22%);
  border-radius: 18px;
  background: rgb(8 29 30 / 43%);
  backdrop-filter: blur(12px);
}

.pool-hero-quote span {
  color: #c5dfd6;
  font-size: 12px;
}

.pool-hero-quote strong {
  font-size: clamp(23px, 2.8vw, 38px);
  line-height: 1.08;
  letter-spacing: -0.045em;
  font-variant-numeric: tabular-nums;
  overflow-wrap: anywhere;
}

.pool-hero-quote small {
  color: #c5dfd6;
  font-size: 11px;
  line-height: 1.4;
}

.pool-snapshot-line {
  display: flex;
  align-items: center;
  gap: 10px 18px;
  flex-wrap: wrap;
  padding: 14px 5px 25px;
  color: #637772;
  font-size: 12px;
}

.pool-live-dot {
  width: 7px;
  height: 7px;
  margin-right: -10px;
  border-radius: 50%;
  background: #49b3a1;
}

.pool-snapshot-line span:last-child {
  margin-left: auto;
  padding: 4px 9px;
  border: 1px solid var(--pool-stroke);
  border-radius: 999px;
  color: var(--pool-teal);
  font-weight: 650;
}

.pool-layout {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 300px;
  align-items: start;
  gap: 32px;
}

.pool-catalog,
.pool-aside {
  min-width: 0;
}

.pool-section-heading {
  display: flex;
  align-items: end;
  justify-content: space-between;
  gap: 16px;
  margin: 0 0 15px;
}

.pool-section-heading .pool-eyebrow {
  color: var(--pool-teal);
  margin-bottom: 5px;
}

.pool-section-heading h3 {
  margin: 0;
  color: var(--pool-ink);
  font-size: 22px;
  font-weight: 700;
  line-height: 1.2;
  letter-spacing: -0.035em;
  text-transform: none;
}

.pool-section-heading > span {
  color: #6e817c;
  font-size: 12px;
  white-space: nowrap;
}

.pool-preview-toggle {
  flex: none;
  padding: 9px 14px;
  border: 1px solid var(--pool-teal);
  border-radius: 999px;
  background: var(--pool-teal);
  color: #fff;
  font: inherit;
  font-size: 12px;
  font-weight: 680;
  cursor: pointer;
}

.pool-preview-toggle:hover,
.pool-preview-toggle:focus-visible {
  background: #095951;
}

.pool-featured {
  display: grid;
  grid-template-columns: minmax(210px, 0.86fr) minmax(0, 1.14fr);
  overflow: hidden;
  border: 1px solid var(--pool-stroke);
  border-radius: 20px;
  background: #fff;
  box-shadow: 0 18px 50px rgb(20 58 54 / 8%);
}

.pool-featured-image,
.pool-offer-art {
  position: relative;
  overflow: hidden;
  background: radial-gradient(circle at 26% 18%, #d5ede1 0, transparent 31%), linear-gradient(145deg, #e6efe5, #d4e2d9);
}

.pool-featured-image {
  min-height: 285px;
}

.pool-featured-image::before,
.pool-offer-art::before {
  content: "";
  position: absolute;
  inset: 15%;
  border: 1px solid rgb(17 88 78 / 17%);
  border-radius: 46% 54% 45% 55%;
  transform: rotate(-25deg);
  pointer-events: none;
}

.pool-featured-number,
.pool-offer-art-mark {
  position: absolute;
  z-index: 2;
  top: 17px;
  left: 17px;
  color: #26685f;
  font-size: 10px;
  font-weight: 800;
  letter-spacing: 0.12em;
}

.pool-featured-body {
  padding: 26px 28px 22px;
}

.pool-tag {
  display: inline-block;
  padding: 5px 9px;
  border-radius: 999px;
  background: #e4f3e9;
  color: #12684d;
  font-size: 11px;
  font-weight: 700;
}

.pool-tag-secondary {
  background: #f4efe5;
  color: #8b6130;
}

.pool-featured h4 {
  margin: 17px 0 8px;
  font-size: clamp(24px, 2.5vw, 33px);
  line-height: 1.12;
  letter-spacing: -0.04em;
}

.pool-featured-body > p {
  margin: 0;
  color: #697d77;
  font-size: 12px;
  line-height: 1.5;
}

.pool-featured-body .pool-id,
.pool-offer-byline .pool-id {
  display: inline-block;
  padding: 0;
  border: 0;
  vertical-align: baseline;
}

.pool-featured-body .pool-id summary,
.pool-offer-byline .pool-id summary {
  color: var(--pool-teal);
  font-size: 12px;
}

.pool-featured-amount {
  display: flex;
  flex-direction: column;
  gap: 4px;
  padding: 20px 0 13px;
}

.pool-featured-amount span {
  color: #697d77;
  font-size: 11px;
}

.pool-featured-amount strong {
  color: var(--pool-deep);
  font-size: 26px;
  letter-spacing: -0.04em;
  font-variant-numeric: tabular-nums;
}

.pool-featured-proof {
  font-size: 11px !important;
  font-weight: 650;
}

.pool-featured .pool-flips {
  margin-top: 10px;
}

.pool-featured .pool-flips summary {
  color: var(--pool-teal);
  font-size: 12px;
  font-weight: 700;
}

.pool-preview-compact {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  gap: 6px;
  padding: 18px;
  margin: 0;
}

.pool-preview-compact > button {
  z-index: 1;
  max-width: 140px;
  padding: 9px 12px;
  border: 1px solid rgb(10 81 71 / 32%);
  border-radius: 999px;
  background: rgb(255 255 255 / 86%);
  color: var(--pool-teal);
  font-size: 11px;
  font-weight: 700;
  line-height: 1.35;
  text-align: center;
  text-decoration: none;
  box-shadow: 0 4px 18px rgb(23 76 63 / 12%);
}

.pool-preview-compact > p {
  max-width: 20ch;
  margin: 0;
  color: #27665f;
  text-align: center;
  font-size: 11px;
  font-weight: 680;
}

.pool-preview-compact .pool-preview-images {
  position: absolute;
  inset: 0;
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 4px;
  padding: 4px;
}

.pool-preview-compact .pool-preview-images img {
  width: 100%;
  height: 100%;
  border: 0;
  border-radius: 0;
  background: #fff;
  object-fit: cover;
}

.pool-explorer-note,
.pool-queue-rule,
.pool-order-intro {
  margin: 12px 0 0;
  color: #6b7e79;
  font-size: 12px;
  line-height: 1.5;
}

.pool-browse-heading {
  margin-top: 34px;
}

.pool-lookup {
  margin-top: 0;
  padding: 9px 13px;
  border: 1px solid var(--pool-stroke);
  border-radius: 12px;
  background: #fff;
}

.pool-lookup label {
  color: #52716a;
  font-size: 12px;
  font-weight: 700;
}

.pool-lookup input {
  max-width: none;
  border: 0;
  outline: 0;
  padding: 5px 0;
  background: transparent;
}

.pool-lookup:focus-within {
  border-color: var(--pool-teal);
  box-shadow: 0 0 0 3px rgb(18 111 104 / 10%);
}

.pool-queue-rule {
  margin: 10px 0 14px;
}

.pool-offers {
  display: grid;
  gap: 12px;
  padding: 0;
  margin: 0;
  list-style: none;
}

.pool-offer-card {
  display: grid;
  grid-template-columns: 150px minmax(0, 1fr);
  min-height: 140px;
  overflow: hidden;
  border: 1px solid var(--pool-stroke);
  border-radius: 15px;
  background: #fff;
}

.pool-offer-body {
  min-width: 0;
  padding: 15px 17px 13px;
}

.pool-offer-topline,
.pool-offer-foot {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
}

.pool-position {
  color: #7b8f88;
  font-size: 11px;
}

.pool-offer-body h4 {
  margin: 11px 0 5px;
  font-size: 17px;
  letter-spacing: -0.025em;
}

.pool-offer-byline {
  color: #6c817b;
  font-size: 11px;
}

.pool-offer-foot {
  margin-top: 15px;
  color: #617c73;
  font-size: 11px;
}

.pool-offer-foot .pool-flips {
  padding: 0;
  border: 0;
}

.pool-offer-foot .pool-flips summary {
  color: var(--pool-teal);
  font-size: 11px;
  font-weight: 700;
}

.pool-offer-foot .pool-flips[open] {
  width: 100%;
}

.pool-offer-foot .pool-cids {
  max-width: 100%;
  padding-left: 16px;
}

.pool-other-offers {
  margin-top: 20px;
}

.pool-empty {
  margin: 0;
  padding: 22px;
  border: 1px dashed var(--pool-stroke);
  border-radius: 14px;
  color: #6e817c;
  background: var(--pool-sand);
}

.pool-count {
  margin-top: 12px;
  color: #6e817c;
  font-size: 12px;
}

.pool-aside {
  position: sticky;
  top: 20px;
  display: grid;
  gap: 16px;
}

.pool-aside .pool-curve,
.pool-economics {
  margin: 0;
  padding: 20px;
  border: 1px solid var(--pool-stroke);
  border-radius: 17px;
  background: var(--pool-sand);
}

.pool-aside h3 {
  margin: 0 0 9px;
  color: var(--pool-ink);
  font-size: 15px;
  font-weight: 700;
  letter-spacing: -0.01em;
  text-transform: none;
}

.pool-curve p,
.pool-aside-note {
  color: #6a7e77;
  font-size: 11px;
  line-height: 1.5;
}

.pool-curve-chart {
  width: 100%;
  margin: 12px 0;
  color: var(--pool-teal);
}

.pool-curve-values {
  gap: 9px;
}

.pool-curve-values div {
  min-width: 90px;
}

.pool-curve-values dt {
  font-size: 10px;
}

.pool-curve-values dd {
  font-size: 12px;
  font-weight: 690;
}

.pool-economics dl {
  margin: 0;
}

.pool-economics dl > div {
  display: flex;
  justify-content: space-between;
  gap: 12px;
  padding: 9px 0;
  border-bottom: 1px solid var(--pool-stroke);
}

.pool-economics dl > div:last-child {
  border-bottom: 0;
}

.pool-economics dt {
  color: #6a7e77;
  font-size: 11px;
}

.pool-economics dd {
  margin: 0;
  font-size: 11px;
  font-weight: 700;
  text-align: right;
  overflow-wrap: anywhere;
}

.pool-aside-note {
  margin: 0;
  padding: 0 5px;
}

.pool-order-section {
  margin-top: 42px;
}

.pool-order-intro {
  margin: -2px 0 14px;
}

.pool-orders {
  border-radius: 14px;
}

.pool-orders th {
  background: var(--pool-sand);
}

.pool-experimental {
  margin: 26px 0 0;
  padding-top: 16px;
  border-top: 1px solid var(--pool-stroke);
  color: #71857f;
  font-size: 11px;
  line-height: 1.5;
}

@media (max-width: 850px) {
  .pool-layout {
    grid-template-columns: minmax(0, 1fr);
  }

  .pool-aside {
    position: static;
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }

  .pool-aside-note {
    grid-column: 1 / -1;
  }
}

@media (max-width: 600px) {
  .pool-hero {
    grid-template-columns: minmax(0, 1fr);
    gap: 22px;
    padding: 28px 25px;
    border-radius: 18px;
  }

  .pool-hero h2 {
    font-size: 38px;
  }

  .pool-hero-quote {
    padding: 16px 18px;
  }

  .pool-snapshot-line span:last-child {
    margin-left: 0;
  }

  .pool-featured {
    grid-template-columns: minmax(0, 1fr);
  }

  .pool-featured-image {
    min-height: 225px;
  }

  .pool-featured-body {
    padding: 21px;
  }

  .pool-offer-card {
    grid-template-columns: 112px minmax(0, 1fr);
  }

  .pool-offer-body {
    padding: 12px;
  }

  .pool-offer-foot {
    align-items: flex-start;
    flex-direction: column;
    gap: 7px;
  }

  .pool-aside {
    grid-template-columns: minmax(0, 1fr);
  }

  .pool-section-heading h3 {
    font-size: 20px;
  }
}
